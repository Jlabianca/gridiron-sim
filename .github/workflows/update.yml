name: Refresh data and deploy

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~7am ET: picks up new games, injury reports and lines
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Build model from nflverse (+ game-day forecasts)
        run: |
          python scripts/build_data.py --refresh | tee build.log
          grep "^weather:" build.log | sed 's/^/::notice title=Forecasts::/'
      - name: Calibrate clock and scoring
        run: node scripts/calibrate.js site/data/model.json
      - name: Update scorecard (save pre-game projections, grade finals)
        run: node scripts/scorecard.js site/data/model.json site/data/history.json
      - name: Fetch sportsbook lines (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/fetch_odds.py | tee odds.log
          grep "^odds:" odds.log | sed 's/^/::notice title=Odds::/'
      - name: Build edge board
        run: |
          node scripts/edges.js site/data/model.json site/data/odds.json site/data/edges.json 10000 | tee edges.log
          grep "^edges:" edges.log | sed 's/^/::notice title=Edges::/' || true
      - name: Save history and odds to the repo
        continue-on-error: true   # never block the deploy over this
        run: |
          git config user.name "gridiron-sim bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json
          [ -f site/data/odds.json ] && git add site/data/odds.json
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch --depth=20 origin main && git rebase -X ours origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          echo "::warning title=Save::could not push history/odds (check Settings → Actions → General → Workflow permissions = Read and write)"
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
