name: Refresh data and deploy

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~7am ET: picks up new games, injury reports and lines
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Build model from nflverse (+ game-day forecasts)
        run: |
          python scripts/build_data.py --refresh | tee build.log
          grep "^weather:" build.log | sed 's/^/::notice title=Forecasts::/'
      - name: Calibrate clock and scoring
        run: node scripts/calibrate.js site/data/model.json
      - name: Restore scorecard history and odds from the live site
        run: python scripts/restore_data.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Update scorecard (save pre-game projections, grade finals)
        run: node scripts/scorecard.js site/data/model.json site/data/history.json
      - name: Fetch sportsbook lines (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/fetch_odds.py | tee odds.log
          grep "^odds:" odds.log | sed 's/^/::notice title=Odds::/'
      - name: Build edge board
        run: |
          node scripts/edges.js site/data/model.json site/data/odds.json site/data/edges.json 10000 | tee edges.log
          grep "^edges:" edges.log | sed 's/^/::notice title=Edges::/' || true
      - name: Fantasy projections
        run: node scripts/fantasy.js site/data/model.json site/data/fantasy.json 2500 | tee fantasy.log
      - name: Season simulation + power ratings
        run: |
          node scripts/season.js site/data/model.json site/data/season.json 800 10000 | tee season.log
          node scripts/ratings_history.js site/data/season.json site/data/ratings_history.json
      - name: Today page previews
        run: node scripts/today.js site/data/model.json site/data/today.json 3000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
